; Pont RFID ESP32 - BiblioRFID / ILMS
; Cible de reference : ESP32-WROOM-32 (DevKit v1, 38 broches).
; Le Bluetooth classique (SPP) n'existe que sur cette famille.
; Sur ESP32-S3 / C3 / C6, retirer -DPONT_LINK_BT=1 : il faudra un lien BLE.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Deux slots OTA de 1,9375 Mo : le binaire complet (Wi-Fi + Bluetooth
; classique) pese ~1,58 Mo, trop pour les slots de 1,25 Mo de default.csv.
; Voir partitions.csv, et ota.cpp pour le mecanisme de mise a jour.
board_build.partitions = partitions.csv

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DPONT_LINK_UART=1
    -DPONT_LINK_WIFI=1
    -DPONT_LINK_BT=1
    -DCORE_DEBUG_LEVEL=1

; Variante sans radio : lecteur relie au poste par USB/UART uniquement.
; Sans Wi-Fi, il n'y a pas d'OTA : la mise a jour se fait par USB.
[env:esp32dev-uart-only]
extends = env:esp32dev
build_flags =
    -DPONT_LINK_UART=1
    -DPONT_LINK_WIFI=0
    -DPONT_LINK_BT=0
    -DCORE_DEBUG_LEVEL=0
